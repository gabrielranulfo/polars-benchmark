---
# HorizontalPodAutoscaler for PySpark Workers
# DESATIVADO: o código em execute_all() controla replicas manualmente
# (elasticidade-workers-dinamicos). HPA conflitava com _scale_workers().
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pyspark-worker-hpa
  namespace: tpch-benchmark
  labels:
    app: pyspark-benchmark
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pyspark-worker
  minReplicas: 0
  maxReplicas: 0
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max