---
# PySpark Driver Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyspark-driver
  namespace: tpch-benchmark
  labels:
    app: pyspark-benchmark
    component: driver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyspark-benchmark
      component: driver
  template:
    metadata:
      labels:
        app: pyspark-benchmark
        component: driver
    spec:
      serviceAccountName: pyspark-sa
      volumes:
      - name: output-volume
        persistentVolumeClaim:
          claimName: tpch-output-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: tpch-data-pvc
      containers:
      - name: pyspark-driver
        image: gabrielranulfo/tpch-benchmark:pyspark-latest
        imagePullPolicy: Always
        command:
        - "/usr/local/lib/python3.11/dist-packages/pyspark/bin/spark-submit"
        - "--master"
        - "spark://pyspark-master:7077"
        - "--conf"
        - "spark.driver.host=$(POD_IP)"
        - "--conf"
        - "spark.driver.bindAddress=0.0.0.0"
        - "--conf"
        - "spark.driver.memory=$(SPARK_DRIVER_MEMORY)"
        - "--conf"
        - "spark.executor.memory=$(SPARK_EXECUTOR_MEMORY)"
        - "--conf"
        - "spark.executor.cores=$(SPARK_EXECUTOR_CORES)"
        - "/root/polars-benchmark/queries/pyspark/__main__.py"
        env:
        - name: RUN_PYSPARK_MASTER
          value: "spark://pyspark-master:7077"
        - name: SPARK_MASTER
          value: "spark://pyspark-master:7077"
        - name: SPARK_DRIVER_MEMORY
          value: "4g"
        - name: SPARK_EXECUTOR_MEMORY
          value: "4g"
        - name: SPARK_EXECUTOR_CORES
          value: "2"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SPARK_LOCAL_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: RUN_LOG_TIMINGS
          value: "1"
        volumeMounts:
        - name: output-volume
          mountPath: /root/polars-benchmark/output
        - name: data-volume
          mountPath: /root/polars-benchmark/data/tables
        resources:
          requests:
            cpu: "1"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        livenessProbe:
          exec:
            command: ["python", "--version"]
          initialDelaySeconds: 30
          periodSeconds: 10

---
# PySpark Master Service
apiVersion: v1
kind: Service
metadata:
  name: pyspark-master
  namespace: tpch-benchmark
  labels:
    app: pyspark-benchmark
    component: master
spec:
  type: ClusterIP
  selector:
    app: pyspark-benchmark
    component: master
  ports:
  - name: master
    port: 7077
    targetPort: 7077
  - name: webui
    port: 8080
    targetPort: 8080

---
# PySpark Master Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyspark-master
  namespace: tpch-benchmark
  labels:
    app: pyspark-benchmark
    component: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyspark-benchmark
      component: master
  template:
    metadata:
      labels:
        app: pyspark-benchmark
        component: master
    spec:
      serviceAccountName: pyspark-sa
      volumes:
      - name: output-volume
        persistentVolumeClaim:
          claimName: tpch-output-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: tpch-data-pvc
      containers:
      - name: pyspark-master
        image: gabrielranulfo/tpch-benchmark:pyspark-latest
        imagePullPolicy: Always
        command:
        - "/usr/local/lib/python3.11/dist-packages/pyspark/bin/spark-class"
        - "org.apache.spark.deploy.master.Master"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "7077"
        - "--webui-port"
        - "8080"
        ports:
        - name: master
          containerPort: 7077
        - name: webui
          containerPort: 8080
        volumeMounts:
        - name: output-volume
          mountPath: /root/polars-benchmark/output
        - name: data-volume
          mountPath: /root/polars-benchmark/data/tables
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          tcpSocket:
            port: 7077
          initialDelaySeconds: 30
          periodSeconds: 10

---
# PySpark Workers Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyspark-worker
  namespace: tpch-benchmark
  labels:
    app: pyspark-benchmark
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pyspark-benchmark
      component: worker
  template:
    metadata:
      labels:
        app: pyspark-benchmark
        component: worker
    spec:
      serviceAccountName: pyspark-sa
      volumes:
      - name: output-volume
        persistentVolumeClaim:
          claimName: tpch-output-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: tpch-data-pvc
      containers:
      - name: pyspark-worker
        image: gabrielranulfo/tpch-benchmark:pyspark-latest
        imagePullPolicy: Always
        command:
        - "/usr/local/lib/python3.11/dist-packages/pyspark/bin/spark-class"
        - "org.apache.spark.deploy.worker.Worker"
        - "--host"
        - "$(POD_IP)"
        - "--cores"
        - "2"
        - "--memory"
        - "4g"
        - "spark://pyspark-master:7077"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SPARK_WORKER_CORES
          value: "2"
        - name: SPARK_WORKER_MEMORY
          value: "4g"
        volumeMounts:
        - name: output-volume
          mountPath: /root/polars-benchmark/output
        - name: data-volume
          mountPath: /root/polars-benchmark/data/tables
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          exec:
            command: ["python", "--version"]
          initialDelaySeconds: 30
          periodSeconds: 10
