---
# ServiceAccount for Dask
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dask-sa
  namespace: tpch-benchmark

---
# ServiceAccount for PySpark
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyspark-sa
  namespace: tpch-benchmark

---
# ClusterRole for metrics reading
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tpch-metrics-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding for Dask
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dask-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tpch-metrics-reader
subjects:
- kind: ServiceAccount
  name: dask-sa
  namespace: tpch-benchmark

---
# ClusterRoleBinding for PySpark
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pyspark-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tpch-metrics-reader
subjects:
- kind: ServiceAccount
  name: pyspark-sa
  namespace: tpch-benchmark
